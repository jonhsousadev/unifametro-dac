<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz - Desenvolvimento de Aplicações Corporativas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #22d3ee;
      --accent-hover: #06b6d4;
      --border: #334155;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

    .header {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
      max-width: 650px;
    }
    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .header h2 {
      font-size: 1rem;
      font-weight: 400;
      color: #94a3b8;
    }

    .quiz-container { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; max-width: 650px; width: 100%; padding: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .progress-bar { width: 100%; height: 8px; background-color: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 24px; }
    .progress-fill { height: 100%; background-color: var(--accent); width: 0%; transition: width 0.3s ease; }

    .question-header { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 8px; font-weight: 600; }
    .question-text { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.5; }

    .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .option-btn { background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 14px 18px; border-radius: 8px; text-align: left; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover { border-color: var(--accent); background: #1a253a; }
    .option-btn.selected { border-color: var(--accent); background: var(--accent); }

    .actions { display: flex; justify-content: flex-end; }
    .btn-next { background-color: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-next:hover { background-color: var(--accent-hover); }
    .btn-next:disabled { opacity: 0.5; cursor: not-allowed; }

    .start-container { text-align: center; width: 100%; }
    .start-container h2 { font-size: 1.5rem; margin-bottom: 12px; }
    .start-container p { color: #94a3b8; margin-bottom: 24px; }
    .name-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 24px;
      text-align: center;
    }
    .name-input::placeholder { color: #64748b; }
    .name-input:focus { outline: none; border-color: var(--accent); }
    .btn-start { background-color: var(--accent); color: white; border: none; padding: 14px 32px; border-radius: 6px; font-weight: 600; font-size: 1.1rem; cursor: pointer; transition: background 0.2s; }
    .btn-start:hover { background-color: var(--accent-hover); }
    .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }

    .result-container { text-align: center; display: none; width: 100%; }
    .result-score { font-size: 3rem; font-weight: bold; color: var(--accent); margin: 16px 0; }
    .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
    .btn-secondary { background-color: #334155; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-secondary:hover { background-color: #475569; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Desenvolvimento de Aplicações Corporativas</h1>
    <h2>UNIFAMETRO - Prof. Jonh Sousa</h2>
  </div>

  <div class="quiz-container">

    <div id="start-body" class="start-container">
      <h2>Nivelamento Web</h2>
      <p>HTML5, CSS3 e JavaScript - 30 questoes aleatorias</p>
      <input type="text" class="name-input" id="student-name" placeholder="Digite seu nome completo">
      <br>
      <button class="btn-start" id="start-btn" disabled>Iniciar Quiz</button>
    </div>

    <div id="quiz-body" class="hidden">
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <div class="question-header" id="question-number">Questao 1 de 30</div>
      <div class="question-text" id="question-text"></div>
      <div class="options-list" id="options-container"></div>
      <div class="actions">
        <button class="btn-next" id="next-btn" disabled>Avancar</button>
      </div>
    </div>

    <div id="result-body" class="result-container">
      <h2>Quiz Finalizado!</h2>
      <div class="result-score" id="final-score">0 / 30</div>
      <p id="feedback-message"></p>
      <div class="btn-group">
        <button class="btn-secondary" onclick="gerarPDF()">Baixar PDF</button>
        <button class="btn-secondary" onclick="reiniciarQuiz()">Refazer Quiz</button>
      </div>
    </div>

  </div>

  <script>
    const TOTAL_QUESTOES = 30;
    const STORAGE_KEY = 'quiz_aula1_progress';
    const allQuestoes = [];
    let questoes = [];
    let questaoAtual = 0;
    let pontuacao = 0;
    let respostas = [];
    let alunoNome = '';
    let opcaoSelecionada = null;

    const startBody = document.getElementById('start-body');
    const quizBody = document.getElementById('quiz-body');
    const resultBody = document.getElementById('result-body');
    const progressEl = document.getElementById('progress');
    const qNumberEl = document.getElementById('question-number');
    const qTextEl = document.getElementById('question-text');
    const optionsEl = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const startBtn = document.getElementById('start-btn');
    const nameInput = document.getElementById('student-name');
    const finalScoreEl = document.getElementById('final-score');
    const feedbackEl = document.getElementById('feedback-message');

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function selecionarQuestoes() {
      const shuffled = shuffleArray(allQuestoes);
      return shuffled.slice(0, TOTAL_QUESTOES);
    }

    function salvarProgresso() {
      const data = {
        nome: alunoNome,
        questoes: questoes,
        questaoAtual: questaoAtual,
        pontuacao: pontuacao,
        respostas: respostas
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function carregarProgresso() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    async function carregarQuestoes() {
      try {
        const response = await fetch('./questoes.json');
        const dados = await response.json();
        allQuestoes.length = 0;
        dados.forEach(q => allQuestoes.push(q));

        const progresso = carregarProgresso();
        if (progresso && progresso.respostas && progresso.respostas.length < TOTAL_QUESTOES) {
          alunoNome = progresso.nome;
          questoes = progresso.questoes;
          questaoAtual = progresso.questaoAtual;
          pontuacao = progresso.pontuacao;
          respostas = progresso.respostas;
          nameInput.value = alunoNome;
          startBody.classList.add('hidden');
          quizBody.classList.remove('hidden');
          exibirQuestao();
        } else {
          nameInput.addEventListener('input', () => {
            startBtn.disabled = nameInput.value.trim().length < 3;
          });
        }
      } catch (error) {
        qTextEl.textContent = "Erro ao carregar o arquivo questoes.json.";
      }
    }

    startBtn.addEventListener('click', () => {
      alunoNome = nameInput.value.trim();
      questoes = selecionarQuestoes();
      questaoAtual = 0;
      pontuacao = 0;
      respostas = [];
      startBody.classList.add('hidden');
      quizBody.classList.remove('hidden');
      exibirQuestao();
    });

    function exibirQuestao() {
      opcaoSelecionada = null;
      nextBtn.disabled = true;

      const q = questoes[questaoAtual];
      qNumberEl.textContent = `Questao ${questaoAtual + 1} de ${questoes.length}`;
      qTextEl.textContent = q.pergunta;
      progressEl.style.width = `${((questaoAtual + 1) / questoes.length) * 100}%`;

      if (respostas[questaoAtual] !== undefined) {
        opcaoSelecionada = respostas[questaoAtual];
      }

      optionsEl.innerHTML = '';
      q.opcoes.forEach((opcao, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        if (respostas[questaoAtual] === idx) {
          btn.classList.add('selected');
        }
        btn.textContent = opcao;
        btn.onclick = () => selecionarOpcao(idx, btn);
        optionsEl.appendChild(btn);
      });

      if (opcaoSelecionada !== null) {
        nextBtn.disabled = false;
      }

      if (questaoAtual === questoes.length - 1) {
        nextBtn.textContent = 'Finalizar';
      } else {
        nextBtn.textContent = 'Avancar';
      }
    }

    function selecionarOpcao(index, btnElement) {
      opcaoSelecionada = index;
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btnElement.classList.add('selected');
      nextBtn.disabled = false;
    }

    nextBtn.addEventListener('click', () => {
      respostas[questaoAtual] = opcaoSelecionada;
      questaoAtual++;
      salvarProgresso();

      if (questaoAtual < questoes.length) {
        exibirQuestao();
      } else {
        mostrarResultado();
      }
    });

    function mostrarResultado() {
      pontuacao = 0;
      questoes.forEach((q, i) => {
        if (respostas[i] === q.respostaCorreta) pontuacao++;
      });

      quizBody.classList.add('hidden');
      resultBody.style.display = 'block';
      finalScoreEl.textContent = `${pontuacao} / ${questoes.length}`;

      const pct = (pontuacao / questoes.length) * 100;
      if (pct >= 80) {
        feedbackEl.textContent = "Excelente! Dominio avancado de HTML5, CSS3 e JavaScript.";
      } else if (pct >= 50) {
        feedbackEl.textContent = "Boa base! Ha espaco para reforcar alguns topicos.";
      } else {
        feedbackEl.textContent = "Recomendado revisar os conceitos fundamentais de HTML5, CSS3 e JavaScript.";
      }

      localStorage.removeItem(STORAGE_KEY);
    }

    function reiniciarQuiz() {
      localStorage.removeItem(STORAGE_KEY);
      questaoAtual = 0;
      pontuacao = 0;
      respostas = [];
      alunoNome = '';
      resultBody.style.display = 'none';
      quizBody.classList.add('hidden');
      startBody.classList.remove('hidden');
      nameInput.value = '';
      startBtn.disabled = true;
    }

    function gerarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.setFont(undefined, 'bold');
      doc.text('Desenvolvimento de Aplicações Corporativas', 105, 15, { align: 'center' });
      doc.setFontSize(12);
      doc.setFont(undefined, 'normal');
      doc.text('UNIFAMETRO - Prof. Jonh Sousa', 105, 22, { align: 'center' });

      doc.setDrawColor(59, 130, 246);
      doc.line(20, 26, 190, 26);

      doc.setFontSize(13);
      doc.setFont(undefined, 'bold');
      doc.text('Nivelamento Web: HTML5, CSS3 e JavaScript', 105, 34, { align: 'center' });

      doc.setFontSize(11);
      doc.setFont(undefined, 'normal');
      doc.text(`Aluno: ${alunoNome}`, 20, 44);
      doc.text(`Nota: ${pontuacao} / ${questoes.length}`, 20, 51);
      doc.text(`Percentual: ${((pontuacao / questoes.length) * 100).toFixed(1)}%`, 130, 51);

      doc.setDrawColor(200, 200, 200);
      doc.line(20, 55, 190, 55);

      let y = 63;
      questoes.forEach((q, i) => {
        const respostaAluno = respostas[i];
        const acertou = respostaAluno === q.respostaCorreta;
        const simbolo = acertou ? '[X]' : '[ ]';

        if (y > 270) {
          doc.addPage();
          y = 20;
        }

        doc.setFontSize(10);
        doc.setFont(undefined, 'bold');
        const textoQ = `${i + 1}. ${simbolo} ${q.pergunta}`;
        const linhasQ = doc.splitTextToSize(textoQ, 170);
        doc.text(linhasQ, 20, y);
        y += linhasQ.length * 5;

        doc.setFont(undefined, 'normal');
        q.opcoes.forEach((op, idx) => {
          if (y > 275) {
            doc.addPage();
            y = 20;
          }
          let prefixo = '  ';
          if (idx === q.respostaCorreta) prefixo = '>>';
          else if (idx === respostaAluno && !acertou) prefixo = '  ';
          doc.text(`${prefixo} ${op}`, 25, y);
          y += 5;
        });

        if (!acertou) {
          doc.setTextColor(34, 197, 94);
          doc.text(`  Resposta correta: ${q.opcoes[q.respostaCorreta]}`, 25, y);
          doc.setTextColor(0, 0, 0);
          y += 6;
        }

        y += 4;
      });

      doc.save(`quiz_${alunoNome.replace(/\s+/g, '_')}.pdf`);
    }

    carregarQuestoes();
  </script>
</body>
</html>
