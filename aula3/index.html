	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){
			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;
			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}
			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}

		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};
        </script>

  <h2>O Que São <span>Atributos</span>?</h2>
  <p style="margin-bottom: 20px;">Informações extras que complementam uma tag HTML.</p>
  <div class="code-block fragment fade-up">
    <span class="keyword">&lt;tag</span> <span class="function">atributo</span>=<span class="string">"valor"</span><span class="keyword">&gt;</span>...<span class="keyword">&lt;/tag&gt;</span>
  </div>
  <ul style="margin-top: 20px;">
    <li class="fragment fade-up"><strong style="color: #fff;">Definem comportamento</strong> ou aparência do elemento</li>
    <li class="fragment fade-up"><strong style="color: #fff;">Auxiliam no estilo</strong>, identificação e acessibilidade</li>
    <li class="fragment fade-up"><strong style="color: #fff;">Fazem o navegador</strong> entender como tratar cada elemento</li>
  </ul>
</div>
</div></script></section>

    <li class="fragment fade-up"><strong style="color: #fff;">Inline:</strong> Útil para testes rápidos, mas dificulta manutenção</li>

    <li class="fragment fade-up"><strong style="color: #fff;">class:</strong> Preferência para reutilização de estilos</li>
    <li class="fragment fade-up"><strong style="color: #fff;">Separação:</strong> O ideal é CSS externo para projetos reais</li>
  </ul>
  <div class="divider fragment fade-up"></div>

    <strong style="color: #22c55e;">Regra de ouro:</strong> HTML para estrutura, CSS para aparência, JS para comportamento.
